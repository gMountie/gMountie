# `version:` is intentionally omitted — the Compose Specification dropped it
# and modern `docker compose` warns when it is present.
name: gmountie

services:
  server:
    # `latest` only exists once a stable (non-prerelease) release ships; with
    # only alpha prereleases published it 404s. Pin a real tag via
    # GMOUNTIE_IMAGE_TAG in .env (see .env.example) until then.
    image: ghcr.io/gmountie/gmountie-server:${GMOUNTIE_IMAGE_TAG:-latest}
    build:
      context: ../../
      dockerfile: Dockerfile
    # Run as the unprivileged uid baked into the image (matches the
    # Dockerfile USER and the chart's runAsUser).
    user: "1000:1000"
    # Container hardening, parity with the Helm chart's securityContext
    # (deployments/charts/gmountie-server/values.yaml): drop every Linux
    # capability and forbid privilege escalation. The quick-start server runs
    # as uid 1000 (Dockerfile USER gmountie) and does loopback-confined FS, so
    # it needs NO caps — the SETUID/SETGID/CHOWN/DAC_* caps are only for the
    # chart's root-mode identity/AssumeUser preset, which this compose does not
    # use.
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    # Read-only root filesystem. The server only writes to the data volume
    # (/data, the named volume below) and to /tmp (provided as a tmpfs). The
    # config is mounted read-only via `configs:` at /config.yaml; no TLS cert
    # files are written in this quick-start.
    read_only: true
    tmpfs:
      - /tmp
    command:
      - --config
      - /config.yaml
    depends_on:
      # Wait for the one-shot chown to finish before the server starts, so the
      # non-root process finds a writable data dir.
      init-permissions:
        condition: service_completed_successfully
    volumes:
      - data-volume:/data
    configs:
      - source: server-config
        target: /config.yaml
    # Only the gRPC port is published. The ops HTTP endpoint (/metrics,
    # /healthz) binds loopback INSIDE the container (server.ops.addr default),
    # so publishing it would forward to a port that never answers. Check
    # health from inside instead:
    #   docker compose exec server wget -qO- http://127.0.0.1:9090/healthz
    ports:
      - "${GRPC_PORT:-9449}:9449"

  # One-shot: give the data volume to uid/gid 1000 (least privilege) instead
  # of the old `chmod 777` sidecar. Runs as root, chowns, exits.
  init-permissions:
    image: alpine:3.20
    command: chown 1000:1000 /data
    # Runs as root to chown the root-owned volume, then exits. Keep only the
    # one capability it needs (CHOWN) and forbid privilege escalation; the
    # root fs is read-only since the only thing it mutates is the mounted
    # /data volume.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    volumes:
      - data-volume:/data
    restart: "no"

volumes:
  data-volume:

configs:
  server-config:
    file: config.yaml
