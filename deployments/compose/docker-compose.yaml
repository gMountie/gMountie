# `version:` is intentionally omitted — the Compose Specification dropped it
# and modern `docker compose` warns when it is present.
name: gmountie

services:
  server:
    image: ghcr.io/gmountie/gmountie-server:${GMOUNTIE_IMAGE_TAG:-latest}
    build:
      context: ../../
      dockerfile: Dockerfile
    # Run as the unprivileged uid baked into the image (matches the
    # Dockerfile USER and the chart's runAsUser).
    user: "1000:1000"
    command:
      - --config
      - /config.yaml
    depends_on:
      # Wait for the one-shot chown to finish before the server starts, so the
      # non-root process finds a writable data dir.
      init-permissions:
        condition: service_completed_successfully
    volumes:
      - data-volume:/data
    configs:
      - source: server-config
        target: /config.yaml
    # Only the gRPC port is published. The ops HTTP endpoint (/metrics,
    # /healthz) binds loopback INSIDE the container (server.ops.addr default),
    # so publishing it would forward to a port that never answers. Check
    # health from inside instead:
    #   docker compose exec server wget -qO- http://127.0.0.1:9090/healthz
    ports:
      - "${GRPC_PORT:-9449}:9449"

  # One-shot: give the data volume to uid/gid 1000 (least privilege) instead
  # of the old `chmod 777` sidecar. Runs as root, chowns, exits.
  init-permissions:
    image: alpine:3.20
    command: chown 1000:1000 /data
    volumes:
      - data-volume:/data
    restart: "no"

volumes:
  data-volume:

configs:
  server-config:
    file: config.yaml
