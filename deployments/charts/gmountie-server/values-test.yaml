# values overlay for the kubevirt test cluster.
# helm upgrade --install gmountie-test deployments/charts/gmountie-server \
#   --namespace gmountie-test -f deployments/charts/gmountie-server/values-test.yaml

image:
  # Floating dev tag pushed on every successful develop CI build
  # (image build pipeline lands separately — see followup).
  tag: dev
  pullPolicy: Always

service:
  type: LoadBalancer
  externalTrafficPolicy: Local

# Push the server off whichever node hosts the gmountie-dev kubevirt
# VM so the cross-node real-network path gets exercised.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              kubevirt.io/vm: gmountie-dev
          topologyKey: kubernetes.io/hostname

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 10Gi
  storageClass: local-path
