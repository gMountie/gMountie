# Default values for gmountie-server.
# Override what you need; defaults aim at a typical single-node cluster
# with local-path persistence.

replicaCount: 1

image:
  repository: ghcr.io/gmountie/gmountie-server
  pullPolicy: IfNotPresent
  # Override per-deploy:  --set image.tag=<commit-sha-or-tag>
  # Empty falls back to Chart.appVersion. NOTE: the in-repo chart carries
  # appVersion "dev", which is never published as an image tag — installing
  # straight from a checkout therefore REQUIRES --set image.tag=<release-tag>
  # (the OCI-published chart gets the real appVersion stamped at release).
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Kubernetes injects Docker-link Service env vars (FOO_SERVICE_PORT,
# FOO_PORT=tcp://...) for every Service in the namespace. Those collide
# with gMountie's GMOUNTIE_ config env prefix and break config parsing
# (e.g. a `gmountie-server` Service sets GMOUNTIE_SERVER_PORT, clobbering
# server.port). The server resolves peers via DNS, not link vars, so we
# disable them by default. Only set true if you specifically need them.
enableServiceLinks: false

# Give the kubelet enough time for the server's own graceful shutdown:
# 30s in-flight drain + 5s session-manager stop + 5s ops-server stop
# (pkg/server/app.go). The Kubernetes default of 30s SIGKILLs right at
# the drain deadline and cuts off session persistence on every rollout.
terminationGracePeriodSeconds: 45

# fsGroup makes the ReadWriteOnce PVC group-writable by the non-root
# container (runAsUser 1000). Without it the volume is root-owned and the
# server cannot write its data dir.
podSecurityContext:
  fsGroup: 1000

# Hardened default: non-root, all capabilities dropped. NOTE: this disables
# the identity/AssumeUser feature — the system/static/passthrough volume
# mapping modes need the server to run as root with the capability set below
# (see docs/design/security-and-transport.md). To enable identity mapping,
# replace this block with the commented preset:
#
# securityContext:
#   runAsNonRoot: false
#   runAsUser: 0
#   runAsGroup: 0
#   allowPrivilegeEscalation: false
#   capabilities:
#     drop: [ALL]
#     add:
#       - SETUID            # setfsuid per-request identity switch
#       - SETGID            # setfsgid + setgroups per-request identity switch
#       - CHOWN             # dac_override post-create chown to the principal
#       - DAC_READ_SEARCH   # admin cap "dac_read_search" (read-only bypass)
#       - DAC_OVERRIDE      # admin cap "dac_override" (full DAC bypass)
#       - FOWNER            # owner-check bypass retained on the dac_override path
#       - FSETID            # keep setgid bits on privileged chmod/chown
#
# (cap set per pkg/server/io/caps.go + bound_fs.go; SETUID/SETGID/CHOWN are
# the minimum for the mapping modes, the DAC_*/FOWNER/FSETID caps are only
# exercised by identities granted the corresponding admin caps.)
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

# Server config — every key (except `auth`, see below) feeds the rendered
# ConfigMap. Mirrors pkg/server/config schema.
config:
  log:
    level: info
    format: console
  server:
    # bind addr inside the pod; Service exposes it externally.
    address: 0.0.0.0
    port: 9449
    # Ops HTTP endpoint (/metrics, /healthz, /readyz, /version). The default
    # loopback bind is reachable via `kubectl port-forward` (which dials
    # inside the pod netns) but NOT via the Service — so the chart only
    # renders the metrics containerPort/Service port when this binds
    # non-loopback. The server requires auth on a non-loopback bind, and
    # basic auth off loopback also needs ops TLS (operator credentials are
    # refused over cleartext). In-cluster scrape preset:
    #
    # ops:
    #   addr: "0.0.0.0:9090"
    #   auth:
    #     type: basic
    #     users:
    #       - username: ops
    #         password_hash: "<output of `gmountie genpass`>"
    #   tls:
    #     # mount the keypair via .Values.volumes / .Values.volumeMounts
    #     cert_file: /etc/gmountie-ops-tls/tls.crt
    #     key_file: /etc/gmountie-ops-tls/tls.key
    #
    # CAVEAT: ops basic-auth users live under config.server (rendered into
    # the ConfigMap), unlike the client `auth` block (Secret-backed). Prefer
    # ops auth.type: mtls if the operator hash must not sit in a ConfigMap.
    ops:
      addr: "127.0.0.1:9090"
  # gMountie's config schema requires `auth`. Pick `none` for an open
  # demo or `basic` with at least one user for anything real.
  #
  # The auth block is rendered into a chart-managed Secret (never the
  # ConfigMap). To keep credentials out of Helm values entirely, set
  # auth.existingSecret below and delete/ignore this block.
  #
  # basic-auth users need an argon2id PHC hash in `password_hash` (NOT a
  # plaintext password — the server rejects that at startup). Generate one
  # with `gmountie genpass` and paste it here. The default below is the
  # PUBLISHED hash of the password "demo" — the chart REFUSES to render an
  # externally exposed install (LoadBalancer/NodePort Service or enabled
  # ingress) that still carries it.
  auth:
    type: basic
    users:
      - username: demo
        password_hash: '$argon2id$v=19$m=65536,t=3,p=4$Zu3uhLZjJNWQzIBQNevo3w$iqBrNtSWBuE6I7dCzQNRHZtPd/zUA8tTG3KnpyQAnew'
  # One or more volumes. `path` is the in-container path; if
  # persistence.enabled=true (below) the PVC is mounted at the FIRST
  # volume's path automatically.
  volumes:
    - name: data
      path: /data

auth:
  # Name of a pre-created Secret carrying the auth config, for keeping
  # credentials out of Helm values/releases. The Secret must contain a key
  # `auth.yaml` whose value is a complete top-level `auth:` block, e.g.:
  #
  #   auth:
  #     type: basic
  #     users:
  #       - username: alice
  #         password_hash: "$argon2id$..."
  #
  # When set, .Values.config.auth is ignored and the chart-managed auth
  # Secret is not created. Rotations need a manual rollout restart (the
  # config checksum annotation only tracks chart-managed content).
  existingSecret: ""

# Opt-in marker that this install is reachable from outside the cluster.
# The chart's demo-credential refusal already triggers automatically for a
# LoadBalancer/NodePort Service or an enabled ingress, but a ClusterIP
# Service fronted by a Gateway-API GRPCRoute + BackendTLSPolicy (the
# documented prod path — see service.appProtocol below) looks internal to
# the chart and would otherwise ship the PUBLISHED demo password externally.
# Set this true for Gateway-API / GRPCRoute installs so the refusal applies.
exposedExternally: false

# Cluster-internal Service. Set type: LoadBalancer (and optionally
# externalTrafficPolicy) to expose externally. For a ClusterIP Service
# exposed via a Gateway-API GRPCRoute, set exposedExternally: true above so
# the demo-credential refusal still fires.
service:
  type: ClusterIP
  port: 9449
  # Service-side port for the authenticated ops endpoint. Only rendered when
  # config.server.ops.addr binds non-loopback (see the ops preset above);
  # with the loopback default there is nothing in-cluster to route to.
  # (For Prometheus scraping use the dedicated `metrics` block below instead —
  # the ops endpoint requires auth off-loopback, which scrapers can't do.)
  opsPort: 9090
  # externalTrafficPolicy: Local
  annotations: {}
  # appProtocol on the grpc port. Empty (default) suits a TLS gRPC backend
  # behind a GRPCRoute + BackendTLSPolicy (Envoy negotiates h2 over TLS via
  # ALPN). Set "kubernetes.io/h2c" only for a cleartext-h2 backend.
  # NOTE: a GRPCRoute exposes a ClusterIP Service externally — set the
  # top-level exposedExternally: true so the demo-credential refusal applies.
  appProtocol: ""

# Plain-HTTP /metrics listener + optional Prometheus-Operator ServiceMonitor.
# Unlike the ops endpoint this listener is UNAUTHENTICATED by design (it
# serves only /metrics — the node-exporter convention), so in-cluster
# scraping works with no credentials or TLS. Enabling it sets
# `server.plain_metrics_addr` in the rendered config and adds a `metrics`
# container + Service port.
metrics:
  enabled: false
  port: 9091
  serviceMonitor:
    # Requires the Prometheus-Operator CRDs (kube-prometheus-stack et al);
    # ignored unless metrics.enabled is also true.
    enabled: false
    interval: 30s
    # Extra labels for Prometheus's serviceMonitorSelector matching
    # (e.g. release: prometheus).
    labels: {}

# Probes default to a TCP dial of the grpc port. The richer HTTP health
# endpoints (/healthz, /readyz) live on the ops server, which binds a
# loopback address by default (and requires auth on a non-loopback bind),
# so the kubelet can't reach them out of the box — an httpGet probe there
# would fail and crashloop the pod. A TCP dial of the always-listening grpc
# port needs no auth and works regardless of the ops/TLS config. Override
# with an httpGet block if you expose the ops endpoint with auth. Disable
# by clearing the block.
livenessProbe:
  tcpSocket:
    port: grpc
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  tcpSocket:
    port: grpc
  initialDelaySeconds: 2
  periodSeconds: 5

# Optional ingress (default off — most clusters expose gMountie via
# Service LoadBalancer or NodePort, not HTTP ingress).
ingress:
  enabled: false
  className: nginx
  annotations:
    # nginx-ingress needs explicit gRPC backend mode.
    nginx.ingress.kubernetes.io/backend-protocol: GRPC
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  host: gmountie.example.com
  tls:
    enabled: false
    secretName: ""

# Conservative defaults for a single-node demo. A memory limit guards the
# node against a runaway cache; no CPU limit (CPU limits throttle rather than
# protect). Raise these for real workloads — cache size in particular drives
# memory.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# Additional in-tree volumes/mounts beyond the volume-data PVC + the
# config ConfigMap/auth Secret that the chart wires automatically.
volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []

# Anti-affinity examples — by default no rules. For the testing
# cluster, set this to push the server off the kubevirt VM's host so
# the cross-node real-network path gets exercised:
#
#   affinity:
#     podAntiAffinity:
#       preferredDuringSchedulingIgnoredDuringExecution:
#         - weight: 100
#           podAffinityTerm:
#             labelSelector:
#               matchLabels:
#                 kubevirt.io/vm: gmountie-dev
#             topologyKey: kubernetes.io/hostname
affinity: {}

persistence:
  # When true, a PVC of `size` is created with `storageClass` and
  # mounted at the FIRST entry in config.volumes[].path. Sufficient
  # for the single-volume default; multi-volume topologies need
  # extra `volumes:` + `volumeMounts:` overrides.
  enabled: true
  accessMode: ReadWriteOnce
  size: 10Gi
  # local-path matches the simple per-node provisioner most test
  # clusters carry (rancher/local-path-provisioner). Override per
  # cluster (e.g. rook-ceph-block, rbd-standard-ssd).
  storageClass: local-path
  annotations: {}
