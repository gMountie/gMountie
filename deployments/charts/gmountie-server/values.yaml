# Default values for gmountie-server.
# Override what you need; defaults aim at a typical single-node cluster
# with local-path persistence.

replicaCount: 1

image:
  repository: ghcr.io/gmountie/gmountie-server
  pullPolicy: IfNotPresent
  # Override per-deploy:  --set image.tag=<commit-sha-or-tag>
  # Empty falls back to Chart.appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Kubernetes injects Docker-link Service env vars (FOO_SERVICE_PORT,
# FOO_PORT=tcp://...) for every Service in the namespace. Those collide
# with gMountie's GMOUNTIE_ config env prefix and break config parsing
# (e.g. a `gmountie-server` Service sets GMOUNTIE_SERVER_PORT, clobbering
# server.port). The server resolves peers via DNS, not link vars, so we
# disable them by default. Only set true if you specifically need them.
enableServiceLinks: false

# fsGroup makes the ReadWriteOnce PVC group-writable by the non-root
# container (runAsUser 1000). Without it the volume is root-owned and the
# server cannot write its data dir.
podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

# Server config — every key feeds the rendered ConfigMap. Mirrors
# pkg/server/config schema; see deployments/compose/config.yaml for
# the legacy reference.
config:
  log:
    level: info
    format: console
  server:
    # bind addr inside the pod; Service exposes it externally.
    address: 0.0.0.0
    port: 9449
    metrics_addr: "0.0.0.0:9090"
  # gMountie's config schema requires `auth`. Pick `none` for an open
  # demo or `basic` with at least one user for anything real.
  #
  # basic-auth users need an argon2id PHC hash in `password_hash` (NOT a
  # plaintext password — the server rejects that at startup). Generate one
  # with `gmountie genpass` and paste it here. The default below is the
  # hash of the password "demo" — change it before exposing the server.
  auth:
    type: basic
    users:
      - username: demo
        password_hash: '$argon2id$v=19$m=65536,t=3,p=4$Zu3uhLZjJNWQzIBQNevo3w$iqBrNtSWBuE6I7dCzQNRHZtPd/zUA8tTG3KnpyQAnew'
  # One or more volumes. `path` is the in-container path; if
  # persistence.enabled=true (below) the PVC is mounted at the FIRST
  # volume's path automatically.
  volumes:
    - name: data
      path: /data

# Cluster-internal Service. Set type: LoadBalancer (and optionally
# externalTrafficPolicy) to expose externally.
service:
  type: ClusterIP
  port: 9449
  metricsPort: 9090
  # externalTrafficPolicy: Local
  annotations: {}
  # appProtocol on the grpc port. Empty (default) suits a TLS gRPC backend
  # behind a GRPCRoute + BackendTLSPolicy (Envoy negotiates h2 over TLS via
  # ALPN). Set "kubernetes.io/h2c" only for a cleartext-h2 backend.
  appProtocol: ""

# Probes hit /healthz on the metrics endpoint (the ops HTTP server
# from Phase 2). Disable by clearing the block.
livenessProbe:
  httpGet:
    path: /healthz
    port: metrics
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /readyz
    port: metrics
  initialDelaySeconds: 2
  periodSeconds: 5

# Optional ingress (default off — most clusters expose gMountie via
# Service LoadBalancer or NodePort, not HTTP ingress).
ingress:
  enabled: false
  className: nginx
  annotations:
    # nginx-ingress needs explicit gRPC backend mode.
    nginx.ingress.kubernetes.io/backend-protocol: GRPC
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  host: gmountie.example.com
  tls:
    enabled: false
    secretName: ""

# Conservative defaults for a single-node demo. A memory limit guards the
# node against a runaway cache; no CPU limit (CPU limits throttle rather than
# protect). Raise these for real workloads — cache size in particular drives
# memory.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# Additional in-tree volumes/mounts beyond the volume-data PVC + the
# config ConfigMap that the chart wires automatically.
volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []

# Anti-affinity examples — by default no rules. For the testing
# cluster, set this to push the server off the kubevirt VM's host so
# the cross-node real-network path gets exercised:
#
#   affinity:
#     podAntiAffinity:
#       preferredDuringSchedulingIgnoredDuringExecution:
#         - weight: 100
#           podAffinityTerm:
#             labelSelector:
#               matchLabels:
#                 kubevirt.io/vm: gmountie-dev
#             topologyKey: kubernetes.io/hostname
affinity: {}

persistence:
  # When true, a PVC of `size` is created with `storageClass` and
  # mounted at the FIRST entry in config.volumes[].path. Sufficient
  # for the single-volume default; multi-volume topologies need
  # extra `volumes:` + `volumeMounts:` overrides.
  enabled: true
  accessMode: ReadWriteOnce
  size: 10Gi
  # local-path matches the simple per-node provisioner most test
  # clusters carry (rancher/local-path-provisioner). Override per
  # cluster (e.g. rook-ceph-block, rbd-standard-ssd).
  storageClass: local-path
  annotations: {}
