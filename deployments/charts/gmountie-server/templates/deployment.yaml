apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gmountie-server.fullname" . }}
  labels:
    {{- include "gmountie-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gmountie-server.selectorLabels" . | nindent 6 }}
  # Recreate (not RollingUpdate): the data PVC is ReadWriteOnce and
  # gMountie keeps the volume mtree in process memory — two replicas
  # touching the same backing dir would race.
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        # Restart the pod whenever the rendered ConfigMap changes.
        # Standard chart idiom.
        checksum/config: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.auth.existingSecret }}
        # Same for the chart-managed auth Secret. (A user-provided
        # auth.existingSecret is outside the release — rotate with a
        # manual rollout restart.)
        checksum/auth: {{ include (print .Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "gmountie-server.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gmountie-server.serviceAccountName" . }}
      # ≥ the server's own shutdown budget: 30s in-flight drain + 5s session
      # stop + 5s ops stop (pkg/server/app.go). The k8s default of 30s would
      # SIGKILL right at the drain deadline on every Recreate rollout.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      # Disable Kubernetes Docker-link Service env vars. They collide with
      # gMountie's GMOUNTIE_ config env prefix: a Service named e.g.
      # gmountie-server injects GMOUNTIE_SERVER_PORT=tcp://<ip>:9449, which
      # viper binds onto server.port and fails to parse ("Port required").
      # The server uses DNS, not link vars, so this is pure upside.
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # Point HOME + every XDG base dir at the writable `state` emptyDir
            # so the server can run with readOnlyRootFilesystem. The only
            # framework writes outside the data PVC and /run/gmountie are the
            # self-signed cert generated on the DEFAULT TLS path (xdg state)
            # and, absent --config, a first-run config — both land here. With a
            # mounted cert_file/key_file (any real deploy) nothing is written.
            - name: HOME
              value: /var/lib/gmountie
            - name: XDG_STATE_HOME
              value: /var/lib/gmountie/state
            - name: XDG_CONFIG_HOME
              value: /var/lib/gmountie/config
            - name: XDG_CACHE_HOME
              value: /var/lib/gmountie/cache
            - name: XDG_DATA_HOME
              value: /var/lib/gmountie/data
          # Assemble the effective config at start: the ConfigMap carries
          # everything but `auth`; the auth Secret carries the credentials.
          # They have distinct top-level YAML keys, so concatenating them is a
          # valid single config file — but ONLY with a newline between them.
          # configmap.yaml renders config.yaml WITHOUT a trailing newline, so
          # an explicit `echo` separator is required; without it the auth block
          # glues onto the last config line (`  path: /dataauth:`) and the
          # server dies with "yaml: line N: mapping values are not allowed".
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              { cat /etc/gmountie/base/config.yaml; echo;
              cat /etc/gmountie/auth/auth.yaml; }
              > /run/gmountie/config.yaml &&
              exec /opt/gmountie/gmountie serve --config /run/gmountie/config.yaml
          ports:
            - name: grpc
              containerPort: {{ .Values.config.server.port }}
              protocol: TCP
            {{- if include "gmountie-server.opsExposed" . }}
            - name: ops
              # The ops HTTP server binds server.ops.addr; this port is only
              # rendered when that addr is non-loopback (otherwise nothing
              # in-cluster can reach it — use kubectl port-forward instead).
              containerPort: {{ include "gmountie-server.opsPort" . }}
              protocol: TCP
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              # Plain /metrics-only listener (server.plain_metrics_addr, injected
              # by the chart) — unauthenticated by design for scrapers.
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/gmountie/base
              readOnly: true
            - name: auth
              mountPath: /etc/gmountie/auth
              readOnly: true
            - name: rendered-config
              mountPath: /run/gmountie
            - name: state
              # Writable HOME / XDG base so the container can run read-only-root.
              mountPath: /var/lib/gmountie
            {{- if .Values.persistence.enabled }}
            - name: data
              # Mount the PVC at the FIRST volume's configured path.
              # Multi-volume setups should turn persistence.enabled off
              # and wire .Values.volumes / .Values.volumeMounts directly.
              mountPath: {{ (index .Values.config.volumes 0).path }}
            {{- end }}
            {{- with .Values.volumeMounts }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "gmountie-server.fullname" . }}-config
        - name: auth
          secret:
            secretName: {{ include "gmountie-server.authSecretName" . }}
        - name: rendered-config
          emptyDir:
            medium: Memory
        - name: state
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "gmountie-server.fullname" . }}-data
        {{- end }}
        {{- with .Values.volumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
