apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gmountie-server.fullname" . }}
  labels:
    {{- include "gmountie-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gmountie-server.selectorLabels" . | nindent 6 }}
  # Recreate (not RollingUpdate): the data PVC is ReadWriteOnce and
  # gMountie keeps the volume mtree in process memory — two replicas
  # touching the same backing dir would race.
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        # Restart the pod whenever the rendered ConfigMap changes.
        # Standard chart idiom.
        checksum/config: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "gmountie-server.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gmountie-server.serviceAccountName" . }}
      # Disable Kubernetes Docker-link Service env vars. They collide with
      # gMountie's GMOUNTIE_ config env prefix: a Service named e.g.
      # gmountie-server injects GMOUNTIE_SERVER_PORT=tcp://<ip>:9449, which
      # viper binds onto server.port and fails to parse ("Port required").
      # The server uses DNS, not link vars, so this is pure upside.
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # `gmountie serve` reads its config via --config (persistent
          # root-cmd flag). Positional args are ignored.
          args:
            - "serve"
            - "--config"
            - "/etc/gmountie/config.yaml"
          ports:
            - name: grpc
              containerPort: {{ .Values.config.server.port }}
              protocol: TCP
            - name: metrics
              # Phase 2 ops HTTP server binds metrics_addr; values.yaml
              # keeps the two port numbers (Service + container) aligned.
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/gmountie
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: data
              # Mount the PVC at the FIRST volume's configured path.
              # Multi-volume setups should turn persistence.enabled off
              # and wire .Values.volumes / .Values.volumeMounts directly.
              mountPath: {{ (index .Values.config.volumes 0).path }}
            {{- end }}
            {{- with .Values.volumeMounts }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "gmountie-server.fullname" . }}-config
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "gmountie-server.fullname" . }}-data
        {{- end }}
        {{- with .Values.volumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
