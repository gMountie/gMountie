apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gmountie-server.fullname" . }}-config
  labels:
    {{- include "gmountie-server.labels" . | nindent 4 }}
data:
  # Rendered from .Values.config — see values.yaml for the source of
  # truth. We dump the sub-tree as-is so adding a new server-side
  # config key needs only a values edit, not a template change. The
  # `auth` block is deliberately omitted: credentials live in the auth
  # Secret (templates/secret.yaml) and are concatenated at container
  # start.
  {{- /* deepCopy so the plain_metrics_addr injection can't mutate .Values for
  other templates; metrics.enabled wires the plain /metrics listener into
  the server config (server.plain_metrics_addr) alongside the values keys. */}}
  {{- $cfg := omit (deepCopy .Values.config) "auth" }}
  {{- if .Values.metrics.enabled }}
  {{- $_ := set $cfg.server "plain_metrics_addr" (printf "0.0.0.0:%v" .Values.metrics.port) }}
  {{- end }}
  config.yaml: |-
{{ $cfg | toYaml | indent 4 }}
