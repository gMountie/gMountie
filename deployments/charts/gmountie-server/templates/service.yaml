apiVersion: v1
kind: Service
metadata:
  name: {{ include "gmountie-server.fullname" . }}
  labels:
    {{- include "gmountie-server.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
      {{- with .Values.service.appProtocol }}
      # appProtocol steers how Gateway-API implementations talk to the
      # backend. Leave empty (default) for a TLS gRPC server fronted by a
      # GRPCRoute + BackendTLSPolicy — Envoy negotiates h2 over TLS via
      # ALPN. Set kubernetes.io/h2c only for a cleartext-h2 backend (this
      # server refuses cleartext on a non-loopback bind, so that's rare).
      appProtocol: {{ . }}
      {{- end }}
    {{- if include "gmountie-server.opsExposed" . }}
    # Only rendered when config.server.ops.addr binds non-loopback; the
    # default loopback ops endpoint is unreachable through a Service.
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "gmountie-server.selectorLabels" . | nindent 4 }}
