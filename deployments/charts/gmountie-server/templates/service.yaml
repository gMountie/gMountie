apiVersion: v1
kind: Service
metadata:
  name: {{ include "gmountie-server.fullname" . }}
  labels:
    {{- include "gmountie-server.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
      # gRPC is HTTP/2. appProtocol h2c tells Gateway-API implementations
      # (Envoy Gateway, etc.) to speak cleartext HTTP/2 upstream so a
      # GRPCRoute/HTTPRoute reaches the server correctly.
      appProtocol: kubernetes.io/h2c
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "gmountie-server.selectorLabels" . | nindent 4 }}
