{{- if not .Values.auth.existingSecret }}
{{- /*
Refuse to render an externally reachable install that still carries the
published demo credential (password "demo"). Internal-only installs
(ClusterIP, no ingress) may keep it for kicking the tires.
*/}}
{{- $exposed := or (eq .Values.service.type "LoadBalancer") (eq .Values.service.type "NodePort") .Values.ingress.enabled .Values.exposedExternally }}
{{- if $exposed }}
{{- range (.Values.config.auth).users }}
{{- if eq (.password_hash | default "") (include "gmountie-server.demoHash" $) }}
{{- fail (printf "config.auth.users[%s] still uses the PUBLISHED demo password hash while the server is exposed externally (service.type=%s, ingress.enabled=%v, exposedExternally=%v). Run 'gmountie genpass' and set a real password_hash, or point auth.existingSecret at your own Secret." .username $.Values.service.type $.Values.ingress.enabled $.Values.exposedExternally) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gmountie-server.authSecretName" . }}
  labels:
    {{- include "gmountie-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The auth block lives in a Secret, never the ConfigMap — it carries
  # credentials (basic-auth password hashes / mTLS ACLs). Concatenated
  # with the ConfigMap's config.yaml at container start (distinct
  # top-level YAML keys, so plain concatenation is valid YAML).
  auth.yaml: |-
    auth:
{{ required "config.auth is required (or set auth.existingSecret)" .Values.config.auth | toYaml | indent 6 }}
{{- end }}
