apiVersion: v2
name: gmountie-server
description: gMountie network filesystem server (FUSE-over-gRPC).

# application chart — installs the server Deployment + ConfigMap + (opt)
# PVC + (opt) Ingress. The client is a FUSE-capable workload that lives
# elsewhere (currently a kubevirt VM under testing/scratch).
type: application

# Chart version — bump on chart template edits.
version: 0.3.0

# appVersion is the gMountie release tag the chart's defaults target. The
# in-repo value "dev" is a placeholder that is NEVER published as an image
# tag — installing the chart straight from a checkout therefore requires
# `--set image.tag=<release-tag>` or the pod lands in ImagePullBackOff.
# The OCI-published chart gets the real release tag stamped via
# `helm package --app-version` at release time.
appVersion: "dev"
