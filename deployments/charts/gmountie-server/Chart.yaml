apiVersion: v2
name: gmountie-server
description: gMountie network filesystem server (FUSE-over-gRPC).

# application chart — installs the server Deployment + ConfigMap + (opt)
# PVC + (opt) Ingress. The client is a FUSE-capable workload that lives
# elsewhere (currently a kubevirt VM under testing/scratch).
type: application

# Chart version — bump on chart template edits.
version: 0.2.0

# appVersion is the gMountie release tag the chart's defaults target.
# Override with `--set image.tag=<sha>` for dev / per-commit testing.
appVersion: "dev"
