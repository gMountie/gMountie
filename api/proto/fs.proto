syntax = "proto3";
package gmountie;
option go_package = "pkg/proto";

import "api/proto/common.proto";

message DirEntry {
  uint32 mode = 1;
  string name = 2;
  uint64 ino = 3;
  uint64 off = 4;
}

// FileTime is an optional absolute timestamp. Field types match Attr's
// mtime/mtimensec so conversions are lossless. A nil FileTime message means
// UTIME_OMIT — leave that timestamp unchanged.
message FileTime {
  uint64 sec  = 1;
  uint32 nsec = 2;
}

message Attr {
  uint64 ino = 1;
  uint64 size = 2;
  uint64 blocks = 3;
  uint64 atime = 4;
  uint64 mtime = 5;
  uint64 ctime = 6;
  uint32 atimensec = 7;
  uint32 mtimensec = 8;
  uint32 ctimensec = 9;
  uint32 mode = 10;
  uint32 nlink = 11;
  Owner owner = 12;
  uint32 uid = 13;
  uint32 gid = 14;
  uint32 rdev = 15;
  uint32 blksize = 16;
  uint32 padding = 17;
  uint64 version = 18;  // Sub-spec D: VersionFromAttr(mtime, size, ctime). Zero from older clients.
}

message StatFsRequest {
  string volume = 1;
  string path = 2;
}

message StatFsReply {
  uint64 blocks = 1;
  uint64 bfree = 2;
  uint64 bavail = 3;
  uint64 files = 4;
  uint64 ffree = 5;
  uint32 bsize = 6;
  uint32 namelen = 7;
  uint32 frsize = 8;
  uint32 padding = 9;
  repeated uint32 spare = 10 [packed = true];
}

message GetAttrRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
}

message GetAttrReply {
  Attr attributes = 1;
  int32 status = 2;
}

message GetAttrIfChangedRequest {
  string volume = 1;
  string path = 2;
  uint64 known_version = 3;
}

message GetAttrIfChangedReply {
  bool not_modified = 1;
  Attr attrs = 2;            // unset when not_modified=true
}

message SubscribeRequest {
  string volume = 1;
}

message SubscribeEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    MUTATED = 1;             // Write / Truncate / Chmod / Chown / Allocate / Create / Mkdir
    DELETED = 2;             // Unlink / Rmdir
    RENAMED = 3;             // Rename — new_path populated
    HEARTBEAT = 4;           // periodic, no path
  }
  Kind kind = 1;
  string path = 2;
  string new_path = 3;       // RENAMED only
  uint64 new_version = 4;    // 0 for DELETED / HEARTBEAT
}

message OpenDirRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
}

message OpenDirReply {
  repeated DirEntry entries = 1;
  int32 status = 2;
}

message UnlinkRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
  string request_id = 4;
  string session_id = 5;
}

message UnlinkReply {
  int32 status = 1;
}

message AccessRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
  uint32 mode = 4;
}

message AccessReply {
  int32 status = 1;
}

message TruncateRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
  uint64 size = 4;
  string request_id = 5;
  string session_id = 6;
}

message TruncateReply {
  int32 status = 1;
}

message ChownRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
  uint32 uid = 4;
  uint32 gid = 5;
  string request_id = 6;
  string session_id = 7;
}

message ChownReply {
  int32 status = 1;
}

message ChmodRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
  uint32 mode = 4;
  string request_id = 5;
  string session_id = 6;
}

message ChmodReply {
  int32 status = 1;
}

message UtimensRequest {
  string   volume     = 1;
  Caller   caller     = 2;
  string   path       = 3;
  FileTime atime      = 4;   // nil => leave atime unchanged (UTIME_OMIT)
  FileTime mtime      = 5;   // nil => leave mtime unchanged (UTIME_OMIT)
  string   request_id = 6;
  string   session_id = 7;
}

message UtimensReply {
  int32 status = 1;
}

message MkdirRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
  uint32 mode = 4;
  string request_id = 5;
  string session_id = 6;
}

message MkdirReply {
  int32 status = 1;
}

message RmdirRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
  string request_id = 4;
  string session_id = 5;
}

message RmdirReply {
  int32 status = 1;
}

message RenameRequest {
  string volume = 1;
  Caller caller = 2;
  string old_name = 3;
  string new_name = 4;
  string request_id = 5;
  string session_id = 6;
}

message RenameReply {
  int32 status = 1;
}

message GetXAttrRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
  string attribute = 4;
}

message GetXAttrReply {
  bytes data = 1;
  int32 status = 2;
}

// CompoundOp carries a single read-only metadata op inside a Compound batch.
// The set is intentionally limited to ops with no idempotency / session
// requirements (no request_id / session_id fields). Per NFSv4 Compound
// semantics, per-op errors do NOT abort the batch — see CompoundReply.
message CompoundOp {
  oneof op {
    GetAttrRequest get_attr = 1;
    StatFsRequest stat_fs = 2;
    OpenDirRequest open_dir = 3;
    AccessRequest access = 4;
    GetXAttrRequest get_xattr = 5;
  }
}

// CompoundReply is the per-op result inside a CompoundBatch. The variant
// matches the request op when it produced a typed reply; on a transport-class
// failure (e.g. unknown volume) the slot carries `status` (an int32 fuse
// status, errno-equivalent) so the batch shape stays N-in / N-out regardless
// of which sub-ops failed.
message CompoundReply {
  oneof reply {
    GetAttrReply get_attr = 1;
    StatFsReply stat_fs = 2;
    OpenDirReply open_dir = 3;
    AccessReply access = 4;
    GetXAttrReply get_xattr = 5;
    int32 status = 6;
  }
}

message CompoundRequest {
  repeated CompoundOp ops = 1;
}

message CompoundBatch {
  repeated CompoundReply replies = 1;
}

service RpcFs {
  rpc GetAttr (GetAttrRequest) returns (GetAttrReply);
  rpc StatFs (StatFsRequest) returns (StatFsReply);
  rpc OpenDir (OpenDirRequest) returns (OpenDirReply);
  rpc Unlink (UnlinkRequest) returns (UnlinkReply);
  rpc Access (AccessRequest) returns (AccessReply);
  rpc Truncate (TruncateRequest) returns (TruncateReply);
  rpc Chown (ChownRequest) returns (ChownReply);
  rpc Chmod (ChmodRequest) returns (ChmodReply);
  rpc Utimens (UtimensRequest) returns (UtimensReply);
  rpc Mkdir (MkdirRequest) returns (MkdirReply);
  rpc Rmdir (RmdirRequest) returns (RmdirReply);
  rpc Rename (RenameRequest) returns (RenameReply);
  rpc GetXAttr (GetXAttrRequest) returns (GetXAttrReply);
  rpc Compound (CompoundRequest) returns (CompoundBatch);
  rpc GetAttrIfChanged (GetAttrIfChangedRequest) returns (GetAttrIfChangedReply);
  rpc Subscribe (SubscribeRequest) returns (stream SubscribeEvent);
}
