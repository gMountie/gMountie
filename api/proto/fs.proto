syntax = "proto3";
package gmountie;
option go_package = "pkg/proto";

import "api/proto/common.proto";

message DirEntry {
  uint32 mode = 1;
  string name = 2;
  uint64 ino = 3;
  uint64 off = 4;
}

// DelegationRequest is piggybacked on a mutating op: "while you're processing
// this, please grant me a write-delegation rooted here." root is a volume-
// relative path. Empty/absent = no request (the op is still arbitrated for
// recall-on-contention regardless).
message DelegationRequest {
  string root = 1;
}

// DelegationGrant is piggybacked on a mutating reply. granted_root may be
// SHORTER than the requested root (server carved around cooling/!owned paths);
// empty granted_root = denied. excluded_paths are sub-paths under granted_root
// the client must treat as undelegated. retry_after_ms hints when to re-request
// a denied/cooling root (advisory only).
message DelegationGrant {
  string          granted_root   = 1;
  repeated string excluded_paths = 2;
  uint64          retry_after_ms = 3;
  // gen is the delegation generation assigned by the server. The client tags
  // every WalOp with this gen so the server can fence superseded replays after
  // a machine-death + handoff (Task 6). gen == 0 means "no gen" (untagged).
  uint64          gen            = 4;
}

// RecallMsg is pushed server->client on the Recall stream: "release your
// delegation covering root; flush+invalidate, then ack." recall_id correlates
// the ack.
message RecallMsg {
  string root      = 1;
  uint64 recall_id = 2;
}

// RecallAck is the client's confirmation that the recall is complete (cache
// invalidated, delegation dropped). done is always true in Phase 1 (no partial
// flush); it exists for Phase 2 progress reporting.
message RecallAck {
  uint64 recall_id = 1;
  bool   done      = 2;
}

// FileTime is an optional absolute timestamp. Field types match Attr's
// mtime/mtimensec so conversions are lossless. A nil FileTime message means
// UTIME_OMIT — leave that timestamp unchanged.
message FileTime {
  uint64 sec  = 1;
  uint32 nsec = 2;
}

message Attr {
  uint64 ino = 1;
  uint64 size = 2;
  uint64 blocks = 3;
  uint64 atime = 4;
  uint64 mtime = 5;
  uint64 ctime = 6;
  uint32 atimensec = 7;
  uint32 mtimensec = 8;
  uint32 ctimensec = 9;
  uint32 mode = 10;
  uint32 nlink = 11;
  Owner owner = 12;
  uint32 uid = 13;
  uint32 gid = 14;
  uint32 rdev = 15;
  uint32 blksize = 16;
  uint32 padding = 17;
  uint64 version = 18;  // Sub-spec D: VersionFromAttr(mtime, size, ctime). Zero from older clients.
}

message StatFsRequest {
  string volume = 1;
  string path = 2;
}

message StatFsReply {
  uint64 blocks = 1;
  uint64 bfree = 2;
  uint64 bavail = 3;
  uint64 files = 4;
  uint64 ffree = 5;
  uint32 bsize = 6;
  uint32 namelen = 7;
  uint32 frsize = 8;
  uint32 padding = 9;
  repeated uint32 spare = 10 [packed = true];
}

message GetAttrRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
}

message GetAttrReply {
  Attr attributes = 1;
  FsError status = 2;
}

message GetAttrIfChangedRequest {
  string volume = 1;
  string path = 2;
  uint64 known_version = 3;
  // Caller carries the wire identity so passthrough volumes can
  // revalidate as the real uid/gid (not anon) when no ctx principal
  // is established. Mapped modes ignore it and use the ctx principal.
  Caller caller = 4;
}

message GetAttrIfChangedReply {
  bool not_modified = 1;
  Attr attrs = 2;            // unset when not_modified=true
}

message SubscribeRequest {
  string volume = 1;
  // Caller carries the wire identity so the server can filter events by
  // per-path access — a subscriber must not learn the existence of paths
  // it has no read access to. The server binds identity once at stream
  // start and Access-checks every event before forwarding.
  Caller caller = 2;
}

message SubscribeEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    MUTATED = 1;             // Write / SetAttr / SetXAttr / Allocate / Create / Mkdir
    DELETED = 2;             // Unlink / Rmdir
    RENAMED = 3;             // Rename — new_path populated
    HEARTBEAT = 4;           // periodic, no path
  }
  Kind kind = 1;
  string path = 2;
  string new_path = 3;       // RENAMED only
  uint64 new_version = 4;    // 0 for DELETED / HEARTBEAT
}

message UnlinkRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
  string request_id = 4;
  string session_id = 5;
  DelegationRequest delegation = 6;
}

message UnlinkReply {
  FsError status = 1;
  DelegationGrant grant = 2;
}

message AccessRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
  uint32 mode = 4;
}

message AccessReply {
  FsError status = 1;
}

// ReadlinkRequest reads the target string of a symbolic link. Read-only:
// no session / request_id (the kernel calls Readlink during pathwalk).
message ReadlinkRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
}

message ReadlinkReply {
  string target = 1;
  FsError status = 2;
}

// SetAttrRequest applies any combination of settable attributes in ONE RPC.
// `valid` is a bitmask mirroring FUSE FATTR_*: 1=MODE 2=UID 4=GID 8=SIZE
// 16=ATIME 32=MTIME. The server applies size→mode→owner→times in order and
// stops at the first failure. Replaced the per-field Truncate/Chmod/Chown/
// Utimens RPCs (a FUSE SETATTR used to fan out into up to 4 serial RPCs +
// a trailing GetAttr); those RPCs were removed from the protocol.
message SetAttrRequest {
  string   volume     = 1;
  Caller   caller     = 2;
  string   path       = 3;
  uint32   valid      = 4;
  uint32   mode       = 5;
  uint32   uid        = 6;
  uint32   gid        = 7;
  uint64   size       = 8;
  FileTime atime      = 9;   // nil with ATIME unset => untouched
  FileTime mtime      = 10;
  string   request_id = 11;
  string   session_id = 12;
  DelegationRequest delegation = 13;
}

message SetAttrReply {
  Attr  attributes = 1;  // final attrs on success — no trailing GetAttr
  FsError status     = 2;
  DelegationGrant grant = 3;
}

// ReadDirRequest streams the directory in batches, optionally with per-entry
// attrs (READDIRPLUS). Streaming removes the unary 16 MiB message ceiling
// that made very large directories fail with EIO; `plus` lets one round-trip
// prime the client attr cache so the kernel's per-entry LOOKUPs are local
// hits.
message ReadDirRequest {
  string volume = 1;
  Caller caller = 2;
  string path   = 3;
  bool   plus   = 4;
  bool   with_xattr = 5;  // ask the server to listxattr each entry (cache-only)
}

message DirEntryPlus {
  DirEntry entry      = 1;
  Attr     attributes = 2;  // set when plus=true and the per-entry stat succeeded
  // xattr_listed is true when with_xattr was requested AND the per-entry
  // listxattr succeeded. It is the prime signal: proto3 cannot distinguish an
  // empty repeated field (no xattrs) from "not requested", so the client primes
  // its xattr cache only when this bool is set.
  bool             xattr_listed = 3;
  repeated string  xattr_names  = 4;  // entry's xattr names; empty == no xattrs
}

message ReadDirBatch {
  repeated DirEntryPlus entries = 1;
  FsError status = 2;  // non-zero only on a terminal error batch
}

message MkdirRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
  uint32 mode = 4;
  string request_id = 5;
  string session_id = 6;
  DelegationRequest delegation = 7;
}

message MkdirReply {
  FsError status     = 1;
  Attr  attributes = 2;  // fills EntryOut without a post-create GetAttr (mirrors CreateReply)
  DelegationGrant grant = 3;
}

message RmdirRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
  string request_id = 4;
  string session_id = 5;
  DelegationRequest delegation = 6;
}

message RmdirReply {
  FsError status = 1;
  DelegationGrant grant = 2;
}

message RenameRequest {
  string volume = 1;
  Caller caller = 2;
  string old_name = 3;
  string new_name = 4;
  string request_id = 5;
  string session_id = 6;
  DelegationRequest delegation = 7;
}

message RenameReply {
  FsError status = 1;
  DelegationGrant grant = 2;
}

// SymlinkRequest creates a new symbolic link `link_path` whose target is
// `target` (stored verbatim — confinement at resolve-time, not at create-
// time, mirrors the on-disk semantics). Write op: session + request_id.
message SymlinkRequest {
  string volume = 1;
  Caller caller = 2;
  string target = 3;      // what the link points to (any string; inert until followed)
  string link_path = 4;   // the new dirent to create within the volume tree
  string request_id = 5;
  string session_id = 6;
  DelegationRequest delegation = 7;
}

message SymlinkReply {
  FsError status     = 1;
  Attr  attributes = 2;  // fills EntryOut without a post-create GetAttr (mirrors CreateReply)
  DelegationGrant grant = 3;
}

message GetXAttrRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
  string attribute = 4;
}

message GetXAttrReply {
  bytes data = 1;
  FsError status = 2;
}

message SetXAttrRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
  string attribute = 4;
  bytes data = 5;
  XAttrCreateMode flags = 6;  // OS-neutral; mapped per-host via pkg/common/fsconv
  string request_id = 7;
  string session_id = 8;
  DelegationRequest delegation = 9;
}

message SetXAttrReply {
  FsError status = 1;
  DelegationGrant grant = 2;
}

message RemoveXAttrRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
  string attribute = 4;
  string request_id = 5;
  string session_id = 6;
  DelegationRequest delegation = 7;
}

message RemoveXAttrReply {
  FsError status = 1;
  DelegationGrant grant = 2;
}

message ListXAttrRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
}

message ListXAttrReply {
  repeated string attributes = 1;
  FsError status = 2;
}

// CreateRequest creates a new file and returns an open fd for it.
// Moved here from file.proto so WalOp (below) can reference it without a
// circular import (file.proto imports fs.proto for Attr/DelegationRequest).
message CreateRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
  uint32 flags = 4;
  uint32 mode = 5;
  string session_id = 6;
  string request_id = 7;
  DelegationRequest delegation = 8;
}

// WriteOp is a path-based write (the deferred form of WriteAndFlush): no fd,
// the server opens/writes/closes internally during Apply.
message WriteOp {
  string volume     = 1;
  Caller caller     = 2;
  string path       = 3;
  int64  offset     = 4;
  bytes  data       = 5;
  string request_id = 6;
}

// ReleaseOp marks a deferred close — flushes any final state for path. Mostly a
// no-op marker today (the create/writes already carry the bytes) but reserved so
// the WAL records the full lifecycle.
message ReleaseOp {
  string volume     = 1;
  Caller caller     = 2;
  string path       = 3;
  string request_id = 4;
}

// WalOp is one deferred mutating op replayed/flushed via Apply. PATH-BASED:
// it reuses the existing unary request messages (which carry volume + path +
// caller), so the server needs no client fd mapping. seq is the client's
// monotone per-(identity,volume) sequence; gen is the delegation generation the
// op was deferred under (fences superseded replay). request_id (already on each
// inner message) still drives idempotency.
message WalOp {
  oneof op {
    CreateRequest      create       = 1;
    WriteOp            write        = 2;   // path-based write (see WriteOp)
    MkdirRequest       mkdir        = 3;
    RmdirRequest       rmdir        = 4;
    UnlinkRequest      unlink       = 5;
    RenameRequest      rename       = 6;
    SymlinkRequest     symlink      = 7;
    SetAttrRequest     set_attr     = 8;
    SetXAttrRequest    set_xattr    = 9;
    RemoveXAttrRequest remove_xattr = 10;
    ReleaseOp          release      = 11;  // deferred close (path-based)
  }
  uint64 seq = 20;
  uint64 gen = 21;
}

// ApplyAck is the single terminal reply to the Apply client-streaming RPC.
// failed_seq=0 + fserr=FS_OK means full success. On the first failing op the
// server returns early: failed_seq identifies it, fserr carries the error.
message ApplyAck {
  uint64  watermark  = 1;  // highest seq durably applied (persisted before this ack)
  uint64  failed_seq = 2;  // 0 == no failure
  FsError fserr      = 3;  // FS_OK unless an op failed (ordered halt)
}

// Protocol v-next BREAKING CHANGE: the OpenDir, Truncate, Chmod, Chown,
// Utimens and Compound RPCs (and their messages) were removed — directory
// listing goes through the streaming ReadDir, attribute changes through the
// single-RPC SetAttr. Clients and servers must upgrade together.
service RpcFs {
  rpc GetAttr (GetAttrRequest) returns (GetAttrReply);
  rpc StatFs (StatFsRequest) returns (StatFsReply);
  rpc Unlink (UnlinkRequest) returns (UnlinkReply);
  rpc Access (AccessRequest) returns (AccessReply);
  rpc Mkdir (MkdirRequest) returns (MkdirReply);
  rpc Rmdir (RmdirRequest) returns (RmdirReply);
  rpc Rename (RenameRequest) returns (RenameReply);
  rpc Readlink (ReadlinkRequest) returns (ReadlinkReply);
  rpc Symlink (SymlinkRequest) returns (SymlinkReply);
  rpc GetXAttr (GetXAttrRequest) returns (GetXAttrReply);
  rpc SetXAttr (SetXAttrRequest) returns (SetXAttrReply);
  rpc RemoveXAttr (RemoveXAttrRequest) returns (RemoveXAttrReply);
  rpc ListXAttr (ListXAttrRequest) returns (ListXAttrReply);
  rpc GetAttrIfChanged (GetAttrIfChangedRequest) returns (GetAttrIfChangedReply);
  rpc Subscribe (SubscribeRequest) returns (stream SubscribeEvent);
  rpc SetAttr (SetAttrRequest) returns (SetAttrReply);
  rpc ReadDir (ReadDirRequest) returns (stream ReadDirBatch);
  // Recall is the coherence control plane: the client opens this bidi stream
  // once per mount; the server pushes RecallMsg when another client contends a
  // delegated subtree; the client replies RecallAck when it has released it.
  rpc Recall (stream RecallAck) returns (stream RecallMsg);
  // Apply replays/flushes a batch of deferred WAL ops. Client-streaming: the
  // client pipelines WalOps in seq order and half-closes; the server applies in
  // order (dedup ≤ watermark, fence revoked gen), persists the watermark, then
  // returns ONE ApplyAck. On first failure it SendAndCloses early.
  rpc Apply (stream WalOp) returns (ApplyAck);
}
