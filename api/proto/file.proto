syntax = "proto3";
package gmountie;
option go_package = "pkg/proto";

import "api/proto/common.proto";
import "api/proto/fs.proto";

message FileLock {
  uint64 start = 1;
  uint64 end = 2;
  uint32 typ = 3;
  uint32 pid = 4;
}

message OpenRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
  uint32 flags = 4;
  string session_id = 5;
  string request_id = 6;
}

message OpenReply {
  uint64 fd = 1;
  int32 status = 2;
}

message CreateRequest {
  string volume = 1;
  Caller caller = 2;
  string path = 3;
  uint32 flags = 4;
  uint32 mode = 5;
  string session_id = 6;
  string request_id = 7;
}

message CreateReply {
  uint64 fd = 1;
  int32 status = 2;
  Attr attributes = 3;   // lets the client fill EntryOut without a post-create GetAttr
}

message ReadRequest {
  string volume = 1;
  uint64 fd = 2;
  int64 offset = 3;
  uint32 size = 4;
  string session_id = 5;
}

message ReadFrame {
  bytes data = 1;
  int32 status = 2;
}

// WriteFrame is a single chunk of a client-streaming Write RPC. The FIRST
// frame carries the full header (volume/fd/session_id/request_id/offset).
// Subsequent frames carry only `data` — header fields MUST be either
// zero-valued or exactly equal to frame 1 (the server pins the values
// from frame 1 and rejects any other value as InvalidArgument).
message WriteFrame {
  string volume = 1;
  uint64 fd = 2;
  string session_id = 3;
  string request_id = 4;
  int64 offset = 5;
  bytes data = 6;
}

message WriteReply {
  uint32 written = 1;
  int32 status = 2;
}

message FsyncRequest {
  string volume = 1;
  uint64 fd = 2;
  int64 flags = 3;
  string session_id = 4;
}

message FsyncReply {
  int32 status = 1;
}

message ReleaseRequest {
  string volume = 1;
  uint64 fd= 2;
  string session_id = 3;
}

message ReleaseReply {
}

message FlushRequest {
  string volume = 1;
  uint64 fd = 2;
  string session_id = 3;
}

message FlushReply {
  int32 status = 1;
}

// WriteAndFlush fuses the deferred coalesced write and the flush into one RPC
// at FUSE FLUSH time (the errno reaches the app's close()). data may be empty
// (a pure flush). Unary: only used for buffers <= WriteCoalesceBytes.
message WriteAndFlushRequest {
  string volume     = 1;
  uint64 fd         = 2;
  int64  offset     = 3;
  bytes  data       = 4;
  string session_id = 5;
}

message WriteAndFlushReply {
  uint32 written    = 1;
  int32  status     = 2;   // write errno if the write failed, else the flush errno
  Attr   final_attr = 3;
}

message GetLkRequest {
  string volume = 1;
  uint64 fd = 2;
  uint64 owner = 3;
  uint32 flags = 4;
  FileLock lk = 5;
  string session_id = 6;
}

message GetLkReply {
  int32 status = 1;
  FileLock lk = 2;
}

message SetLkRequest {
  string volume = 1;
  uint64 fd = 2;
  uint64 owner = 3;
  uint32 flags = 4;
  FileLock lk = 5;
  string session_id = 6;
}

message SetLkReply {
  int32 status = 1;
}

message SetLkwRequest {
  string volume = 1;
  uint64 fd = 2;
  uint64 owner = 3;
  uint32 flags = 4;
  FileLock lk = 5;
  string session_id = 6;
}

message SetLkwReply {
  int32 status = 1;
}

message AllocateRequest {
  string volume = 1;
  Caller caller = 2;
  uint64 fd = 3;
  string path = 4;
  uint64 off = 5;
  uint64 size = 6;
  uint32 mode = 7;
  string session_id = 8;
}

message AllocateReply {
  int32 status = 1;
}

service RpcFile {
  rpc Open (OpenRequest) returns (OpenReply);
  rpc Create (CreateRequest) returns (CreateReply);
  rpc Read (ReadRequest) returns (stream ReadFrame);
  rpc Write (stream WriteFrame) returns (WriteReply);
  rpc Release (ReleaseRequest) returns (ReleaseReply);
  rpc Fsync (FsyncRequest) returns (FsyncReply);
  rpc Flush (FlushRequest) returns (FlushReply);
  rpc WriteAndFlush (WriteAndFlushRequest) returns (WriteAndFlushReply);
  rpc GetLk (GetLkRequest) returns (GetLkReply);
  rpc SetLk (SetLkRequest) returns (SetLkReply);
  rpc SetLkw (SetLkwRequest) returns (SetLkwReply);
  rpc Allocate (AllocateRequest) returns (AllocateReply);
}
