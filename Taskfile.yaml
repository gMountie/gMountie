# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

includes:

  ui:
    dir: ./ui
    taskfile: ./ui/Taskfile.yml
    optional: true


tasks:
  setup:
    desc: Install all system packages and Go tools required to build, test, and develop gMountie (Linux/apt only).
    cmds:
      - task: setup:system
      - task: setup:tools
      - task: setup:hooks

  setup:hooks:
    desc: Point git at the tracked .githooks/ dir so the pre-push lint hook runs on every push.
    preconditions:
      - sh: '[ -d .git ] || git rev-parse --git-dir >/dev/null 2>&1'
        msg: "setup:hooks must run inside the gMountie git repository."
    cmds:
      - git config core.hooksPath .githooks
      - echo "git hooks installed (core.hooksPath -> .githooks). pre-push now runs 'task lint'."

  setup:system:
    desc: Install system packages via apt (protoc, FUSE, GTK/WebKit for the UI, fio for e2e benches).
    preconditions:
      - sh: '[ "$(uname -s)" = "Linux" ]'
        msg: "setup:system only supports Linux. Install the equivalents manually on other OSes."
      - sh: command -v apt-get >/dev/null
        msg: "setup:system requires apt-get. Install the equivalent packages manually with your package manager."
    cmds:
      - sudo apt-get update
      # `nodejs` ships npm bundled on recent Ubuntu; do NOT also request the separate `npm` package — it conflicts.
      - |
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          protobuf-compiler \
          fuse3 \
          libfuse3-dev \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          nodejs \
          fio \
          iproute2

  setup:tools:
    desc: Install Go-based developer tools into $GOBIN / $GOPATH/bin. protoc plugins are pinned via the `tool` directive in go.mod.
    preconditions:
      - sh: command -v go >/dev/null
        msg: "Go is not installed or not on PATH. Install Go 1.26+ first: https://go.dev/dl/"
    cmds:
      # Installs every entry in go.mod's `tool (...)` block (protoc-gen-go, protoc-gen-go-grpc) at its pinned version.
      - go install tool
      # goreleaser and wails3 aren't pinned in go.mod (huge dep trees / CLI source doesn't build cleanly at the library version); install at @latest.
      - go install github.com/goreleaser/goreleaser/v2@latest
      - go install github.com/wailsapp/wails/v3/cmd/wails3@latest
      - echo "Done. Ensure \"$(go env GOPATH)/bin\" is on your PATH."

  gen:grpc:
    cmds:
      - |
        protoc --go_out=. --go-grpc_out=. api/proto/*.proto

  gen:mocks:
    cmds:
      - rm -rf internal/mocks
      - go run github.com/vektra/mockery/v3@v3.7.0

  lint:
    cmds:
      # Pinned (not @latest) so the Go module + build caches reliably
      # hit across runs — @latest re-resolves on every invocation.
      # Bump with intent when there's a reason; dependabot tracks
      # github-actions but not go-run pins, so this is manual.
      #
      # Package list explicitly excludes ./ui and ./pkg/ui. The v2
      # config's exclusions.paths skips REPORTING from those files but
      # they're still loaded by go/packages; loading them transitively
      # imports Wails 3 alpha which needs CGO + GTK/WebKit headers
      # that the lint job doesn't install. UI is Phase 8 (deferred);
      # add the ui trees back when the desktop build returns to CI.
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run {{ .LINT_EXTRA_ARGS }} ./cmd/... ./pkg/client/... ./pkg/server/... ./pkg/common/... ./pkg/utils/... ./pkg/proto/... ./internal/...

  test:
    cmds:
      - go test -failfast -v ./...

  test:coverage:
    cmds:
      # -timeout 15m: go test's default is 10m. The e2e suite (fio + the
      # streaming-write 1 GiB test + cache subscribe + fs benchmarks)
      # is sized to fit comfortably inside 15m on CI runners under load.
      # A higher cap also turns "the suite stuck on a single op" into a
      # clear "test timed out" message instead of an unhelpful SIGQUIT
      # runtime stack dump from go test's panic-on-timeout path.
      - go test -timeout 15m -v -count=1 -coverpkg=./... -covermode=atomic -coverprofile coverage.out ./...
      - grep -v -E "gmountie/internal/mocks|gmountie/test|gmountie/pkg/proto" coverage.out > coverage-filtered.out
      - sed -i 's/^gmountie\///g' coverage-filtered.out
      - mv coverage-filtered.out coverage.out

  build:
    cmds:
      - goreleaser build --snapshot --clean

  docs:install:
    desc: Install the Docusaurus docs-site dependencies (website/).
    dir: ./website
    preconditions:
      - sh: command -v npm >/dev/null
        msg: "npm is required. Run 'task setup:system' (installs nodejs) or install Node 20+."
    cmds:
      - npm ci

  docs:serve:
    desc: Serve the docs locally with live reload (Docusaurus dev server, http://localhost:3000).
    dir: ./website
    preconditions:
      - sh: command -v npm >/dev/null
        msg: "npm is required. Run 'task setup:system' (installs nodejs) or install Node 20+."
      - sh: '[ -d node_modules ]'
        msg: "Docs deps not installed. Run 'task docs:install' first."
    cmds:
      - npm start

  docs:build:
    desc: Build the static docs site into website/build (what CI deploys to docs.gmountie.dev).
    dir: ./website
    preconditions:
      - sh: '[ -d node_modules ]'
        msg: "Docs deps not installed. Run 'task docs:install' first."
    cmds:
      - npm run build

  perf:install:
    desc: Install benchstat (golang.org/x/perf/cmd/benchstat).
    cmds:
      - go install golang.org/x/perf/cmd/benchstat@latest

  perf:bench:
    desc: 'Run perf benchmarks under test/e2e/perf. Vars: OUT (output file), COUNT (default 5), BENCHTIME (default 10s).'
    vars:
      OUT: '{{.OUT | default (printf "perf-out/bench-%s.txt" (now | date "2006-01-02T15-04-05"))}}'
      COUNT: '{{.COUNT | default "5"}}'
      BENCHTIME: '{{.BENCHTIME | default "10s"}}'
    cmds:
      - mkdir -p perf-out
      - |
        set -o pipefail
        go test -run=^$ -bench=. -benchmem -count={{.COUNT}} -benchtime={{.BENCHTIME}} ./test/e2e/perf/ | tee {{.OUT}}
      - echo "wrote {{.OUT}}"

  perf:bench:tcp:
    desc: 'Run perf benchmarks over a real loopback TCP transport (GMOUNTIE_BENCH_TCP=1). Same Vars as perf:bench; bufconn results from perf:bench are not directly comparable.'
    vars:
      OUT: '{{.OUT | default (printf "perf-out/bench-tcp-%s.txt" (now | date "2006-01-02T15-04-05"))}}'
      COUNT: '{{.COUNT | default "5"}}'
      BENCHTIME: '{{.BENCHTIME | default "10s"}}'
    env:
      GMOUNTIE_BENCH_TCP: "1"
    cmds:
      - mkdir -p perf-out
      - |
        set -o pipefail
        go test -run=^$ -bench=. -benchmem -count={{.COUNT}} -benchtime={{.BENCHTIME}} ./test/e2e/perf/ | tee {{.OUT}}
      - echo "wrote {{.OUT}}"

  perf:bench:cache:
    desc: 'Run perf benchmarks with the client-side cache enabled (GMOUNTIE_BENCH_CACHE=1). Same Vars as perf:bench; cache-off results from perf:bench are the natural baseline.'
    vars:
      OUT: '{{.OUT | default (printf "perf-out/bench-cache-%s.txt" (now | date "2006-01-02T15-04-05"))}}'
      COUNT: '{{.COUNT | default "5"}}'
      BENCHTIME: '{{.BENCHTIME | default "10s"}}'
    env:
      GMOUNTIE_BENCH_CACHE: "1"
    cmds:
      - mkdir -p perf-out
      - |
        set -o pipefail
        go test -run=^$ -bench=. -benchmem -count={{.COUNT}} -benchtime={{.BENCHTIME}} ./test/e2e/perf/ | tee {{.OUT}}
      - echo "wrote {{.OUT}}"

  perf:diff:
    desc: 'Compare two perf:bench outputs using benchstat. Vars: BEFORE, AFTER.'
    cmds:
      - benchstat {{.BEFORE}} {{.AFTER}}

  perf:bmf:build:
    desc: Build the perfbmf BMF emitter into ./perf-out/perfbmf.
    cmds:
      - mkdir -p perf-out
      - go build -o perf-out/perfbmf ./test/e2e/perf/cmd/perfbmf/

  perf:ci:
    desc: 'Full perf run (substrate + lan/wan benches + BMF). Set BENCHER=1 to upload. Vars via env: COUNT, BENCHTIME, BENCHER_PROJECT, BENCHER_TESTBED, BENCHER_BRANCH, GIT_HASH. Runner-only (needs FUSE + tc).'
    cmds:
      - bash scripts/perf/run.sh

  perf:plots:diff:
    desc: 'Dry-run: show how the live Bencher dashboard differs from scripts/perf/plots.yaml. Reads $BENCHER_PROJECT, or pass PROJECT=. Read-only (no token needed on a public project).'
    cmds:
      - go run ./test/e2e/perf/cmd/perfbmf/ plots sync --dry-run {{if .PROJECT}}--project {{.PROJECT}}{{end}}

  perf:plots:sync:
    desc: 'Converge the live Bencher dashboard plots to scripts/perf/plots.yaml. Needs $BENCHER_API_TOKEN (+ $BENCHER_PROJECT or PROJECT=). Set PRUNE=1 to delete live plots absent from the spec.'
    cmds:
      - go run ./test/e2e/perf/cmd/perfbmf/ plots sync {{if .PROJECT}}--project {{.PROJECT}}{{end}} {{if .PRUNE}}--prune{{end}}

