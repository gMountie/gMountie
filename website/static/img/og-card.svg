  </text>
  <rect x="306" y="290" width="50" height="6" rx="2" fill="#D9641C"></rect>

  <text x="300" y="350" font-family="&#39;Newsreader&#39;, Georgia, serif" font-size="40" font-weight="360" font-style="italic" fill="#3A3328" letter-spacing="-0.5">
    Mount the remote, not the round-trip.
  </text>

  
  <g transform="translate(80, 470)" font-family="&#39;Newsreader&#39;, Georgia, serif">
    <g>
      <text x="0" y="48" font-size="52" font-weight="320" font-style="italic" letter-spacing="-1.5" fill="#D9641C">no VPN</text>
      <text x="0" y="78" font-family="&#39;Geist Mono&#39;, monospace" font-size="13" letter-spacing="1.4" fill="#6B6151" font-weight="500">OVER THE INTERNET</text>
    </g>
    <g transform="translate(330, 0)">
      <text x="0" y="48" font-size="52" font-weight="320" font-style="italic" letter-spacing="-1.5" fill="#D9641C">mTLS</text>
      <text x="0" y="78" font-family="&#39;Geist Mono&#39;, monospace" font-size="13" letter-spacing="1.4" fill="#6B6151" font-weight="500">ENCRYPTED TRANSPORT</text>
    </g>
    <g transform="translate(640, 0)">
      <text x="0" y="48" font-size="52" font-weight="320" font-style="italic" letter-spacing="-1.5" fill="#D9641C">one binary</text>
      <text x="0" y="78" font-family="&#39;Geist Mono&#39;, monospace" font-size="13" letter-spacing="1.4" fill="#6B6151" font-weight="500">SERVER + CLIENT</text>
