  <text x="1120" y="588" text-anchor="end" font-family="&#39;Geist Mono&#39;, monospace" font-size="14" letter-spacing="1.2" fill="#6B6151" font-weight="500">GMOUNTIE.DEV</text>

  
  <g transform="translate(1010, 200) rotate(8)" opacity="0.92">
