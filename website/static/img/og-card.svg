<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="gMountie — a network filesystem that means it.">
  
  <rect width="1200" height="630" fill="#FBF8F2"></rect>

  
  <g opacity="0.35">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#DFD7C2" stroke-width="1"></path>
      </pattern>
    </defs>
    <rect width="1200" height="630" fill="url(#grid)"></rect>
  </g>

  
  <text x="80" y="86" font-family="&#39;Geist Mono&#39;, &#39;JetBrains Mono&#39;, monospace" font-size="16" letter-spacing="2" fill="#B14C12" font-weight="500" text-transform="uppercase">— gMountie · network filesystem</text>

  
  <g transform="translate(80, 200)">
    <rect width="180" height="180" rx="30" fill="#D9641C"></rect>
    <path d="M 32 130 L 70 50 L 90 92 L 120 38 L 150 130 Z" fill="#FBF8F2"></path>
