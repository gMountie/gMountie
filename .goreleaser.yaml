# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    id: gMountie
    main: cmd/main.go
    binary: gmountie
    flags:
      - -trimpath
      - -buildvcs=true
    ldflags:
      - -s -w -X go.gmountie.dev/gmountie/pkg.version={{.Version}} -X go.gmountie.dev/gmountie/pkg.commit={{.Commit}} -X go.gmountie.dev/gmountie/pkg.date={{.Date}}
    goarch:
      - amd64
      - arm64

dockers_v2:
  - id: gMountie
    ids:
      - gMountie
    # dockers_v2 splits repo name from tag list: images holds the
    # registry/repo (no :tag), tags is the list goreleaser composes
    # against each.
    images:
      - ghcr.io/gmountie/gmountie-server
    tags:
      # `.Tag` keeps the full git tag (incl. leading `v`) so the image
      # tag matches `git describe`, the GitHub release name, and the
      # chart's appVersion. Goreleaser's `.Version` strips the `v`,
      # which we don't want here.
      - "{{ .Tag }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    flags:
      - "--pull"
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.name: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "{{ .GitURL }}"

archives:
  - id: gMountie
    ids:
      - gMountie
    formats: ['tar.gz']
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - src: examples/**/*
        dst: examples
        info:
          mode: 0644
        strip_parent: false

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# SPDX SBOM per release archive (syft default). The container image SBOM is
# generated + attested separately in the Release workflow — goreleaser has no
# native docker SBOM step.
sboms:
  - id: archive
    artifacts: archive

# Keyless blob signing of the checksums file (Sigstore/Fulcio via the GitHub
# Actions OIDC identity → Rekor). Signing the checksum transitively covers
# every archive listed in it. Skipped on snapshot (--skip=sign).
signs:
  - id: checksum
    cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# Keyless signing of the pushed container images + manifest lists. Snapshots
# don't push, so this no-ops there with no conditional needed.
docker_signs:
  - cmd: cosign
    artifacts: all
    args:
      - sign
      - "${artifact}@${digest}"
      - "--yes"
    output: true

release:
  # No `ids` filter: upload everything goreleaser produces for the release —
  # archives, checksums, the per-archive SPDX SBOMs, and the keyless checksum
  # signature/certificate. A restrictive `ids: [gMountie]` here previously
  # dropped the SBOMs and signature from the uploaded assets.
  # Publish straight to the Releases page — no draft step. The Release
  # workflow is already gated on green CI for the commit, so a manual
  # "publish" click on top of that would just be ceremony.
  draft: false
  # `auto` flips prerelease=true when the tag has a semver prerelease
  # suffix, so anything cut by svu's `prerelease --pre-release alpha`
  # (v0.2.0-alpha.N) lands on GitHub flagged as a Pre-release.
  prerelease: auto
  # The curated breaking-changes + feature notes live in CHANGELOG.md
  # (we point at it from the release header). The auto-generated
  # commit list below adds the per-commit detail.
  header: |
    Curated release notes — including breaking changes — live in
    [CHANGELOG.md](https://github.com/gMountie/gMountie/blob/master/CHANGELOG.md).

    Auto-generated commit list:

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
