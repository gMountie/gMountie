# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
    id: gMountie
    main: cmd/main.go
    binary: gMountie
    flags:
      - -trimpath
    ldflags:
      - -s -w -X gmountie/pkg.version={{.Version}} -X gmountie/pkg.commit={{.Commit}} -X gmountie/pkg.date={{.Date}}
    goarch:
      - amd64
      - arm64

dockers:
  - id: gMountie
    goos: linux
    goarch: amd64
    ids:
      - gMountie
    image_templates:
      - "ghcr.io/gmountie/gmountie-server:{{ .Version }}"
      - "ghcr.io/gmountie/gmountie-server:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.name={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.source={{.GitURL}}"

archives:
  - id: gMountie
    builds:
      - gMountie
    formats: ['tar.gz']
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - src: examples/**/*
        dst: examples
        info:
          mode: 0644
        strip_parent: false

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

release:
  ids:
    - gMountie
  draft: true
  prerelease: auto
  # The curated breaking-changes + feature notes live in CHANGELOG.md
  # (we point at it from the release header). The auto-generated
  # commit list below adds the per-commit detail.
  header: |
    Curated release notes — including breaking changes — live in
    [CHANGELOG.md](https://github.com/gMountie/gMountie/blob/master/CHANGELOG.md).

    Auto-generated commit list:

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
