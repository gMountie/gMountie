# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
    id: gMountie
    main: cmd/main.go
    binary: gMountie
    flags:
      - -trimpath
    ldflags:
      - -s -w -X gmountie/pkg.version={{.Version}} -X gmountie/pkg.commit={{.Commit}} -X gmountie/pkg.date={{.Date}}
    goarch:
      - amd64
      - arm64

dockers_v2:
  - id: gMountie
    ids:
      - gMountie
    # dockers_v2 splits repo name from tag list: images holds the
    # registry/repo (no :tag), tags is the list goreleaser composes
    # against each.
    images:
      - ghcr.io/gmountie/gmountie-server
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile
    flags:
      - "--pull"
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.name: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.source: "{{ .GitURL }}"

archives:
  - id: gMountie
    ids:
      - gMountie
    formats: ['tar.gz']
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - src: examples/**/*
        dst: examples
        info:
          mode: 0644
        strip_parent: false

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

release:
  ids:
    - gMountie
  # Publish straight to the Releases page — no draft step. The Release
  # workflow is already gated on green CI for the commit, so a manual
  # "publish" click on top of that would just be ceremony.
  draft: false
  # `auto` flips prerelease=true when the tag has a semver prerelease
  # suffix, so anything cut by svu's `prerelease --pre-release alpha`
  # (v0.2.0-alpha.N) lands on GitHub flagged as a Pre-release.
  prerelease: auto
  # The curated breaking-changes + feature notes live in CHANGELOG.md
  # (we point at it from the release header). The auto-generated
  # commit list below adds the per-commit detail.
  header: |
    Curated release notes — including breaking changes — live in
    [CHANGELOG.md](https://github.com/gMountie/gMountie/blob/master/CHANGELOG.md).

    Auto-generated commit list:

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
