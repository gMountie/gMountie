name: 🐛 Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please **don't** report security
        vulnerabilities here — see [SECURITY.md](https://github.com/gMountie/gMountie/blob/master/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the impact.
      placeholder: When I mount a volume and …, the client returns EIO instead of …
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands and config (with secrets redacted) to reproduce.
      placeholder: |
        1. Start the server: `gmountie serve -c server.yaml`
        2. Mount: `gmountie mount admin@host:9449/shared ~/mnt/shared`
        3. Run `…`
        4. See …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Client (gmountie mount)
        - Server (gmountie serve)
        - Desktop UI
        - CLI / other (ls, config, genpass …)
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: gMountie version
      description: Output of `gmountie version` (or the commit / image tag).
      placeholder: v0.x.y (or commit sha)
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS (client)
      multiple: true
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant logs (run with `-v` for debug). This is rendered as code, no backticks needed.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else — network setup (reverse proxy, high RTT), cache config, etc.
