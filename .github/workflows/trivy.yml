name: Trivy image scan

# Scans the published container image for OS/package CVEs. Runs on a schedule
# (so newly-disclosed CVEs in an already-released image surface) and on demand.
# Report-only: findings go to the Security tab, the run does not fail. To gate
# releases instead, move a scan step into release.yml with exit-code: '1'.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: read # pull the image from ghcr
  security-events: write # upload SARIF to the Security tab

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy scan of the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/gmountie/gmountie-server:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true # only actionable (a fixed version exists) findings

      - name: Upload results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy
