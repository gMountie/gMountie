name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Default to read-only; the badges commit is the only write in this
# workflow and the `test` job elevates to contents:write for it alone.
permissions:
  contents: read
  pull-requests: read

# Cancel an in-progress CI run when a new commit lands on the same
# branch (or the same PR head). Avoids races where two concurrent
# runs both try to write the badges branch, and stops wasted spend
# on commits the developer has already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Install Task
        # `go install` goes through proxy.golang.org and reuses the
        # setup-go module cache — sidesteps the unauthenticated
        # GitHub release API rate limit that arduino/setup-task hits
        # on busy shared runners.
        run: go install github.com/go-task/task/v3/cmd/task@v3.51.1
      # golangci-lint maintains its own per-package incremental analysis
      # cache, independent of Go's build cache. Without persisting it
      # across runs every CI invocation re-analyses every package from
      # scratch even when nothing changed. Key the cache on the lint
      # config + go.mod so it invalidates when either changes.
      - name: Cache golangci-lint analysis
        uses: actions/cache@v5
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('.golangci.yaml', 'go.mod') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-
      - name: Lint
        # task lint go-runs a pinned golangci-lint version (see
        # Taskfile.yaml). The binary is built from source with the
        # project's Go toolchain, dodging the prebuilt-binary version
        # drift that tripped the old golangci-lint-action. Setup-go
        # caches both the module sources and the compiled artifacts.
        run: task lint

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The only job that writes: go-test-coverage commits the coverage
    # badge to the `badges` branch on master pushes.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      # Non-GitHub-org mutable actions are pinned to commit SHAs (dependabot
      # updates SHA pins fine); the comment tracks the resolved tag.
      - uses: awalsh128/cache-apt-pkgs-action@2c09a5e66da6c8016428a2172bd76e5e4f14bb17 # v1.5.3 (current v1)
        with:
          # fio: fio-based fs benchmarks. sqlite3: the WAL-over-FUSE
          # regression test (issue #111) drives the real sqlite3 CLI.
          packages: fio sqlite3
          # bump when the package list changes — it is the apt-cache key.
          version: 2.1
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Install Task
        # `go install` goes through proxy.golang.org and reuses the
        # setup-go module cache — sidesteps the unauthenticated
        # GitHub release API rate limit that arduino/setup-task hits
        # on busy shared runners.
        run: go install github.com/go-task/task/v3/cmd/task@v3.51.1
      - name: Run tests
        run: |
          task test:coverage
      - name: check test coverage
        # Intentionally badge-only: no coverage threshold is enforced (no
        # .testcoverage.yml); revisit once a meaningful floor is agreed.
        uses: vladopajic/go-test-coverage@a93b868a4cbcbf18dc3781650fad241f0020e609 # v2.18.8
        with:
          profile: coverage.out
          local-prefix: go.gmountie.dev/gmountie
          ## when token is not specified (value '') this feature is turned off
          ## in this example badge is created and committed only for main branch
          git-token: ${{ github.ref_name == 'master' && secrets.GITHUB_TOKEN || '' }}
          ## name of branch where badges are stored
          ## ideally this should be orphan branch (see below how to create this branch)
          git-branch: badges

  test-race:
    runs-on: ubuntu-latest
    # 20m (was 15m): test/e2e/api now runs under -race too, and its
    # streaming suite moves real gigabytes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Install Task
        # `go install` goes through proxy.golang.org and reuses the
        # setup-go module cache — sidesteps the unauthenticated
        # GitHub release API rate limit that arduino/setup-task hits
        # on busy shared runners.
        run: go install github.com/go-task/task/v3/cmd/task@v3.51.1
      # Scoped to the concurrent logic packages plus test/e2e/api (see
      # Taskfile test:race) — no fio apt deps needed since the fio e2e
      # suites stay excluded; the api cache suites FUSE-mount, which works
      # on GitHub-hosted runners.
      - name: Race detector
        run: task test:race

  gen-drift:
    # Generated code must match its sources. Regenerates mocks (mockery
    # pinned in Taskfile gen:mocks) and proto stubs, then fails on any
    # diff — catches hand-edited or stale generated files.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.51.1
      # protoc is the one unpinned variable in proto generation (the Go
      # plugins are pinned via go.mod's tool block), so install the exact
      # release the committed stubs were generated with (see the
      # "protoc vX.Y.Z" header in pkg/proto/*.pb.go) and verify its digest.
      - name: Install pinned protoc
        run: |
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip
          echo "3a4c1e5f2516c639d3079b1586e703fc7bcfa2136d58bda24d1d54f949c315e8  /tmp/protoc.zip" | sha256sum -c -
          sudo unzip -o -q /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          protoc --version
      - name: Install pinned protoc plugins
        # Installs go.mod's `tool (...)` block (protoc-gen-go, protoc-gen-go-grpc).
        run: go install tool
      - name: Regenerate mocks and proto stubs
        run: |
          task gen:mocks
          task gen:grpc
      - name: Fail on generated-code drift
        run: |
          git add -A internal/mocks pkg/proto
          git diff --cached --exit-code -- internal/mocks pkg/proto || {
            echo "::error::generated code is out of date — run 'task gen:mocks' and 'task gen:grpc' and commit the result"
            exit 1
          }

  build-darwin:
    # Cross-compile regression guard for the macOS client. cmd/ compiles on
    # darwin because cmd/commands/serve.go is //go:build linux — the server
    # subcommand and the Linux-only syscalls it pulls in stay out of the
    # darwin build. Run on both arches so an amd64-only or arm64-only Linux
    # syscall regression still gets caught.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Cross-compile darwin/${{ matrix.goarch }}
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build ./cmd/...

  install-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck
        run: shellcheck -s sh website/static/install.sh
      - name: unit tests
        run: sh scripts/install/install_test.sh

  install-smoke:
    # End-to-end: run the real installer against the live release artifacts and
    # confirm the binary works. Guards against goreleaser name-template / artifact
    # drift that the unit tests (which use a fixture) cannot see.
    #
    # Deliberately gated to master pushes only: it depends on external release
    # state + CDN availability, so on every PR it would couple unrelated changes
    # to that flakiness and redden the PR. As a post-merge smoke on master it
    # still catches installer/artifact drift without blocking feature PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      # Install cosign so the installer's signature-verification branch actually
      # runs here — otherwise that path (and the checksums.txt byte-exactness it
      # depends on) is never exercised in CI.
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: install via script
        env:
          BIN_DIR: ${{ github.workspace }}/bin
        run: sh website/static/install.sh
      - name: verify binary
        run: ${{ github.workspace }}/bin/gmountie version

