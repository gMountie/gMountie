name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write
  pull-requests: read

# Cancel an in-progress CI run when a new commit lands on the same
# branch (or the same PR head). Avoids races where two concurrent
# runs both try to write the badges branch, and stops wasted spend
# on commits the developer has already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
      # golangci-lint maintains its own per-package incremental analysis
      # cache, independent of Go's build cache. Without persisting it
      # across runs every CI invocation re-analyses every package from
      # scratch even when nothing changed. Key the cache on the lint
      # config + go.mod so it invalidates when either changes.
      - name: Cache golangci-lint analysis
        uses: actions/cache@v5
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('.golang-ci.yaml', 'go.mod') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-
      - name: Lint
        # task lint go-runs a pinned golangci-lint version (see
        # Taskfile.yaml). The binary is built from source with the
        # project's Go toolchain, dodging the prebuilt-binary version
        # drift that tripped the old golangci-lint-action. Setup-go
        # caches both the module sources and the compiled artifacts.
        run: task lint

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # Scope to the trees we care about. ./ui and ./pkg/ui are
          # excluded — Wails 3 alpha needs CGO + GTK/WebKit headers
          # that this lightweight scan job doesn't install, and the
          # UI is Phase 8 (deferred). Listing the trees explicitly
          # (rather than `go list ./... | grep -v ui`) avoids needing
          # go list itself to succeed on the ui packages.
          govulncheck ./cmd/... ./pkg/client/... ./pkg/server/... ./pkg/common/... ./pkg/utils/... ./pkg/proto/...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: fio libwebkit2gtk-4.1-dev gtk+-3.0
          version: 2.0
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
      - name: Run tests
        run: |
          task test:coverage
      - name: check test coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          profile: coverage.out
          local-prefix: github.com/gMountie/gMountie
          ## when token is not specified (value '') this feature is turned off
          ## in this example badge is created and committed only for main branch
          git-token: ${{ github.ref_name == 'master' && secrets.GITHUB_TOKEN || '' }}
          ## name of branch where badges are stored
          ## ideally this should be orphan branch (see below how to create this branch)
          git-branch: badges

  test-race:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
      # Scoped to the concurrent logic packages (see Taskfile test:race) — no
      # fio/GTK apt deps needed since the e2e suite and ./pkg/ui are excluded.
      - name: Race detector
        run: task test:race

