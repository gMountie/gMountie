name: Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Build type'
        type: choice
        options:
          - 'production'
          - 'alpha'
          - 'snapshot'
        required: true
        default: 'snapshot'

permissions:
  contents: write
  packages: write

jobs:

  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Require green CI for this commit
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Production and alpha releases must be cut from a commit whose
        # CI workflow has completed successfully. Snapshots are local
        # builds for ad-hoc testing and skip the gate.
        if [ "${{ github.event.inputs.type }}" = "snapshot" ]; then
          echo "snapshot build — skipping CI gate"
          exit 0
        fi
        sha="${{ github.sha }}"
        echo "looking for a successful CI run for $sha"
        # gh run list filters by workflow + branch; we filter by sha
        # in jq because gh's --commit flag is gated behind a newer
        # version on some runners.
        conclusion="$(gh run list \
          --workflow ci.yml \
          --json headSha,conclusion,status \
          --limit 50 \
          --jq "[.[] | select(.headSha==\"$sha\") | select(.status==\"completed\")][0].conclusion")"
        if [ "$conclusion" != "success" ]; then
          echo "::error::no successful CI run found for $sha (got: '$conclusion')"
          echo "Run the CI workflow on this commit and wait for it to pass before releasing."
          exit 1
        fi
        echo "CI is green for $sha"

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}

    - name: Install dependencies
      run: |
        go install github.com/go-task/task/v3/cmd/task
        go install github.com/caarlos0/svu@latest

    - name: Tag Release (Production)
      if: ${{  github.event.inputs.type == 'production' }}
      run: |
        git tag "$(svu next)"

    - name: Tag Release (Alpha)
      if: ${{  github.event.inputs.type == 'alpha' }}
      run: |
        git tag "$(svu prerelease --pre-release alpha)"

    - name: Set release type
      if: ${{  github.event.inputs.type == 'snapshot' }}
      run: echo "flags=--snapshot" >> $GITHUB_ENV

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        args: release --clean ${{ env.flags }}
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

    - name: Push Tags
      if: ${{  github.event.inputs.type == 'alpha' || github.event.inputs.type == 'production' }}
      run: git push --tags
