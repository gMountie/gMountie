name: Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Build type'
        type: choice
        options:
          - 'production'
          - 'alpha'
          - 'snapshot'
        required: true
        default: 'snapshot'

permissions:
  contents: write
  packages: write
  # Required for keyless cosign signing (Sigstore/Fulcio OIDC).
  id-token: write

jobs:

  # Build the macOS client on a real Mac: it selects the cgofuse adapter, which
  # needs cgo + the FUSE headers, so it can't be cross-compiled on the Linux
  # release runner. Archives match goreleaser's linux naming; the release job
  # downloads them and goreleaser folds them into the single checksums.txt and
  # the release via the extra_files globs in .goreleaser.yaml.
  darwin-binaries:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

    - name: Install macFUSE (FUSE headers for the cgofuse build)
      run: brew install --cask macfuse

    - name: Install svu
      run: go install github.com/caarlos0/svu@v1.12.0

    - name: Build + archive darwin binaries
      env:
        RELEASE_TYPE: ${{ github.event.inputs.type }}
      run: |
        set -euo pipefail
        export PATH="$PATH:$(go env GOPATH)/bin"
        # Compute the same tag the release job will (svu is deterministic for a
        # given history), so the darwin archive name + version ldflags match the
        # Linux artifacts. Snapshot is best-effort (it is not published).
        case "$RELEASE_TYPE" in
          production) TAG="$(svu next)" ;;
          alpha)      TAG="$(svu prerelease --pre-release alpha)" ;;
          *)          TAG="$(svu next)" ;;
        esac
        VERSION="${TAG#v}"
        COMMIT="$(git rev-parse HEAD)"
        DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        LDFLAGS="-s -w -X go.gmountie.dev/gmountie/pkg.version=${VERSION} -X go.gmountie.dev/gmountie/pkg.commit=${COMMIT} -X go.gmountie.dev/gmountie/pkg.date=${DATE}"
        mkdir -p dist-darwin
        for arch in arm64 amd64; do
          echo "== building darwin/${arch} (version=${VERSION}) =="
          rm -rf stage && mkdir -p stage
          if [ "$arch" = "amd64" ]; then
            CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CC="clang -arch x86_64" \
              go build -trimpath -buildvcs=true -ldflags "$LDFLAGS" -o stage/gmountie ./cmd
          else
            CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
              go build -trimpath -buildvcs=true -ldflags "$LDFLAGS" -o stage/gmountie ./cmd
          fi
          cp LICENSE README.md CHANGELOG.md stage/
          # examples/ is optional — goreleaser's archive skips it when absent;
          # match that so the archive contents stay in lockstep with Linux.
          EXTRA=""
          if [ -d examples ]; then cp -R examples stage/examples; EXTRA="examples"; fi
          tar -C stage -czf "dist-darwin/gMountie_${VERSION}_darwin_${arch}.tar.gz" \
            gmountie LICENSE README.md CHANGELOG.md $EXTRA
        done
        echo "== darwin archives ==" && ls -la dist-darwin/

    - name: Upload darwin archives
      uses: actions/upload-artifact@v4
      with:
        name: darwin-archives
        path: dist-darwin/
        if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: darwin-binaries
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Require green CI for this commit
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Production and alpha releases must be cut from a commit whose
        # CI workflow has completed successfully. Snapshots are local
        # builds for ad-hoc testing and skip the gate.
        if [ "${{ github.event.inputs.type }}" = "snapshot" ]; then
          echo "snapshot build — skipping CI gate"
          exit 0
        fi
        sha="${{ github.sha }}"
        echo "looking for a successful CI run for $sha"
        # Exact server-side lookup by head_sha on the CI workflow's runs —
        # unlike `gh run list --limit N`, this cannot miss the run when
        # the commit has scrolled past the most recent N runs.
        conclusion="$(gh api \
          "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$sha&status=completed&per_page=100" \
          --jq '.workflow_runs[0].conclusion')"
        if [ "$conclusion" != "success" ]; then
          echo "::error::no successful CI run found for $sha (got: '$conclusion')"
          echo "Run the CI workflow on this commit and wait for it to pass before releasing."
          exit 1
        fi
        echo "CI is green for $sha"

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

    # cosign signs release artifacts + images (keyless); syft generates the
    # per-archive SPDX SBOMs goreleaser attaches to the release archives. The
    # image is signed but NOT SBOM-attested (see the note after GoReleaser for
    # why the in-registry image SBOM is omitted). Pin the cosign binary. goreleaser's `signs` block uses sign-blob's
    # --output-certificate/--output-signature, which cosign v3 removed; pinning
    # v2.5.2 keeps the signing path stable until that block is migrated.
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: 'v2.5.2'

    - name: Install syft
      uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

    - name: Login to ghcr.io
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
      with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}

    - name: Install svu
      # Pinned: svu computes the release tag, so an unpinned @latest on
      # this path could silently change tagging behavior (v2/v3 renamed
      # flags). v1 is what @latest resolved to here.
      run: go install github.com/caarlos0/svu@v1.12.0

    - name: Tag Release (Production)
      if: ${{  github.event.inputs.type == 'production' }}
      run: |
        git tag "$(svu next)"

    - name: Tag Release (Alpha)
      if: ${{  github.event.inputs.type == 'alpha' }}
      run: |
        git tag "$(svu prerelease --pre-release alpha)"

    - name: Set release type
      if: ${{  github.event.inputs.type == 'snapshot' }}
      # --skip=sign: don't keyless-sign throwaway snapshot artifacts (docker
      # signing already no-ops since snapshots aren't pushed).
      run: echo "flags=--snapshot --skip=sign" >> "$GITHUB_ENV"

    # The darwin-binaries job built + archived the macOS client (cgo, on a Mac).
    # Place its archives where goreleaser's checksum.extra_files /
    # release.extra_files globs expect them (dist-darwin/), so they land in the
    # single signed checksums.txt and the release.
    - name: Download darwin archives
      uses: actions/download-artifact@v4
      with:
        name: darwin-archives
        path: dist-darwin

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
      with:
        args: release --clean ${{ env.flags }}
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

    # No image SBOM attestation: `cosign attest --type spdx --predicate` mangles
    # the syft SPDX predicate (embeds it as a string on cosign v2, errors on
    # v3), producing an attestation no cosign version can verify. The per-archive
    # SBOMs (goreleaser `sboms`) ship as release assets and the image is signed;
    # an in-registry image SBOM isn't worth the cosign breakage. Revisit with
    # actions/attest-sbom if it's wanted later.

    - name: Push Tags
      if: ${{  github.event.inputs.type == 'alpha' || github.event.inputs.type == 'production' }}
      run: git push --tags

    # Publish the Helm chart as an OCI artifact alongside the container
    # image, both in ghcr.io/gmountie. Skipped for snapshots — snapshots
    # are local-throwaway and not worth a registry round-trip.
    #
    # Chart consumers install with:
    #   helm install gmountie oci://ghcr.io/gmountie/charts/gmountie-server \
    #     --version <release-tag-minus-leading-v>
    - name: Set up Helm
      if: ${{ github.event.inputs.type == 'alpha' || github.event.inputs.type == 'production' }}
      uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
      with:
        version: v3.16.4

    - name: Publish chart to ghcr.io (OCI)
      if: ${{ github.event.inputs.type == 'alpha' || github.event.inputs.type == 'production' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        tag=$(git describe --tags --abbrev=0)
        # OCI semver tags must not have a leading v. Strip it for the
        # chart version + app version (the chart's own semver tag and
        # the version label baked into rendered manifests).
        version="${tag#v}"
        echo "packaging chart at version=$version app-version=$tag"

        echo "$GH_TOKEN" | helm registry login ghcr.io \
          --username "$GITHUB_ACTOR" --password-stdin

        helm package deployments/charts/gmountie-server \
          --version "$version" --app-version "$tag" \
          --destination /tmp

        helm push "/tmp/gmountie-server-${version}.tgz" \
          oci://ghcr.io/gmountie/charts

  # Per-release perf run. The definition lives once in perf.yml (also
  # dispatchable on demand); this calls it with release-cadence settings and
  # records the trend on the `master` Bencher branch.
  perf:
    needs: [release]
    if: ${{ github.event.inputs.type != 'snapshot' }}
    uses: ./.github/workflows/perf.yml
    with:
      bencher_branch: master
      count: '6'
      benchtime: '3s'
    secrets: inherit
