name: Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Build type'
        type: choice
        options:
          - 'production'
          - 'alpha'
          - 'snapshot'
        required: true
        default: 'snapshot'

permissions:
  contents: write
  packages: write

jobs:

  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Require green CI for this commit
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Production and alpha releases must be cut from a commit whose
        # CI workflow has completed successfully. Snapshots are local
        # builds for ad-hoc testing and skip the gate.
        if [ "${{ github.event.inputs.type }}" = "snapshot" ]; then
          echo "snapshot build — skipping CI gate"
          exit 0
        fi
        sha="${{ github.sha }}"
        echo "looking for a successful CI run for $sha"
        # gh run list filters by workflow + branch; we filter by sha
        # in jq because gh's --commit flag is gated behind a newer
        # version on some runners.
        conclusion="$(gh run list \
          --workflow ci.yml \
          --json headSha,conclusion,status \
          --limit 50 \
          --jq "[.[] | select(.headSha==\"$sha\") | select(.status==\"completed\")][0].conclusion")"
        if [ "$conclusion" != "success" ]; then
          echo "::error::no successful CI run found for $sha (got: '$conclusion')"
          echo "Run the CI workflow on this commit and wait for it to pass before releasing."
          exit 1
        fi
        echo "CI is green for $sha"

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to ghcr.io
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{github.actor}}
        password: ${{secrets.GITHUB_TOKEN}}

    - name: Install dependencies
      run: |
        go install github.com/go-task/task/v3/cmd/task
        go install github.com/caarlos0/svu@latest

    - name: Tag Release (Production)
      if: ${{  github.event.inputs.type == 'production' }}
      run: |
        git tag "$(svu next)"

    - name: Tag Release (Alpha)
      if: ${{  github.event.inputs.type == 'alpha' }}
      run: |
        git tag "$(svu prerelease --pre-release alpha)"

    - name: Set release type
      if: ${{  github.event.inputs.type == 'snapshot' }}
      run: echo "flags=--snapshot" >> $GITHUB_ENV

    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v7
      with:
        args: release --clean ${{ env.flags }}
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

    - name: Push Tags
      if: ${{  github.event.inputs.type == 'alpha' || github.event.inputs.type == 'production' }}
      run: git push --tags

    # Publish the Helm chart as an OCI artifact alongside the container
    # image, both in ghcr.io/gmountie. Skipped for snapshots — snapshots
    # are local-throwaway and not worth a registry round-trip.
    #
    # Chart consumers install with:
    #   helm install gmountie oci://ghcr.io/gmountie/charts/gmountie-server \
    #     --version <release-tag-minus-leading-v>
    - name: Set up Helm
      if: ${{ github.event.inputs.type == 'alpha' || github.event.inputs.type == 'production' }}
      uses: azure/setup-helm@v4
      with:
        version: v3.16.4

    - name: Publish chart to ghcr.io (OCI)
      if: ${{ github.event.inputs.type == 'alpha' || github.event.inputs.type == 'production' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        tag=$(git describe --tags --abbrev=0)
        # OCI semver tags must not have a leading v. Strip it for the
        # chart version + app version (the chart's own semver tag and
        # the version label baked into rendered manifests).
        version="${tag#v}"
        echo "packaging chart at version=$version app-version=$tag"

        echo "$GH_TOKEN" | helm registry login ghcr.io \
          --username "$GITHUB_ACTOR" --password-stdin

        helm package deployments/charts/gmountie-server \
          --version "$version" --app-version "$tag" \
          --destination /tmp

        helm push "/tmp/gmountie-server-${version}.tgz" \
          oci://ghcr.io/gmountie/charts

  perf:
    needs: [release]
    if: ${{ github.event.inputs.type != 'snapshot' }}
    runs-on: [self-hosted, gmountie-perf]
    env:
      # WORKDIR points at the runner's node-local PV mount (contract with the
      # infra repo) so fio + benches hit a stable local disk, not the ephemeral
      # overlay or tmpfs. run.sh writes all outputs here and the artifact step
      # reads them back from the same path — keep this the single source.
      WORKDIR: /mnt/perf
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve released tag
        id: tag
        run: echo "ref=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

      - name: Run perf suite and upload to Bencher
        env:
          BENCHER: "1"
          BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
          BENCHER_PROJECT: gmountie
          BENCHER_TESTBED: gmountie-perf-pod
          BENCHER_BRANCH: master
          GIT_HASH: ${{ github.sha }}
          COUNT: "10"
          BENCHTIME: "10s"
        run: bash scripts/perf/run.sh

      - name: Upload raw artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ steps.tag.outputs.ref }}
          path: |
            ${{ env.WORKDIR }}/bench-lan.txt
            ${{ env.WORKDIR }}/bench-wan.txt
            ${{ env.WORKDIR }}/substrate.json
            ${{ env.WORKDIR }}/report.bmf.json
          if-no-files-found: warn
