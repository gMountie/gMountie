# Builds the Docusaurus docs site (website/) and deploys it to GitHub Pages.
name: Deploy docs to GitHub Pages

on:
  # Publish the docs site when a release (including a pre-release/alpha) is
  # published. The deploy checks out the release tag so the live site always
  # matches a released version, not whatever is currently on master.
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab (deploys the
  # default branch). Kept as its own workflow precisely so it stays
  # independently dispatchable.
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # On a release event, check out the tagged commit so the published
          # docs match the release. Empty on workflow_dispatch, which makes
          # checkout fall back to the default branch.
          ref: ${{ github.event.release.tag_name }}
          # Full history so Docusaurus can derive "last updated" times from git.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: website
      - name: Build docs site
        run: npm run build
        working-directory: website
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Docusaurus static build output (includes static/CNAME → docs.gmountie.dev)
          path: 'website/build'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
